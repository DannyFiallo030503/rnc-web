{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Paginación">{% if page.has_previous %}<a href="?page=1&q={{ q|urlencode }}">Primera</a><a href="?page={{ page.previous_page_number }}&q={{ q|urlencode }}">Anterior</a>{% endif %}<span aria-current="page">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&q={{ q|urlencode }}">Siguiente</a><a href="?page={{ page.paginator.num_pages }}&q={{ q|urlencode }}">Última</a>{% endif %}</nav>{% endif %}
