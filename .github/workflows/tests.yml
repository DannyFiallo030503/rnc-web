name: Automated tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  backend:
    name: Django backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Unicode fonts for translated graph exports
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-core fonts-noto-cjk
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile and check translation catalogs
        run: |
          python scripts/check_translations.py
          python scripts/compile_translations.py
          python scripts/audit_translation_drafts.py
          python scripts/audit_unmarked_template_text.py
          python scripts/audit_unmarked_python_messages.py
          python scripts/audit_unmarked_javascript_text.py
          python scripts/audit_service_worker_fallbacks.py
          python scripts/translation_release_gate.py --check-activation
      - name: Build and validate opt-in translation preview bundle
        run: |
          python scripts/compile_translation_preview.py --output-dir "$RUNNER_TEMP/rnc-translation-preview"
          RNC_TRANSLATION_PREVIEW=1 RNC_TRANSLATION_PREVIEW_LOCALE_PATH="$RUNNER_TEMP/rnc-translation-preview" python manage.py check
      - name: Run translation catalog and release gate tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Review public, administrative and account flows in all locales
        run: python scripts/review_translation_admin.py
      - name: Run Django suite with branch coverage
        run: |
          coverage run --branch manage.py test --exclude-tag=long_running --verbosity 2
          coverage report --show-missing --skip-covered
      - name: Run combinatorial long-running cases without instrumentation
        run: python manage.py test --tag=long_running --verbosity 2
      - name: Upload review-only translation preview bundle
        uses: actions/upload-artifact@v7
        with:
          name: rnc-translation-preview-${{ github.sha }}
          path: ${{ runner.temp }}/rnc-translation-preview/
          if-no-files-found: error
          retention-days: 7

  browser-e2e:
    name: Chromium end-to-end review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Unicode fonts for translated graph exports
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-core fonts-noto-cjk
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-review.txt
      - name: Install application and review dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-review.txt
      - name: Compile translation catalogs
        run: python scripts/compile_translations.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run PWA offline and functional review
        run: python scripts/review_pwa.py
      - name: Run synthetic PWA stress profile
        run: python scripts/stress_pwa.py
      - name: Run full browser walkthrough
        run: python scripts/review_ui.py
