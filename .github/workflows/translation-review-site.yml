name: Translation review website

on:
  push:
    branches: [develop]
    paths:
      - "locale/**"
      - "translation-review-site/**"
      - "scripts/build_translation_review_site.py"
      - "config/languages.py"
      - ".github/workflows/translation-review-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: translation-review-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog parser
        run: python -m pip install polib==1.2.0
      - name: Build review website
        run: python scripts/build_translation_review_site.py --output-dir _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish review website
        id: deployment
        uses: actions/deploy-pages@v4
